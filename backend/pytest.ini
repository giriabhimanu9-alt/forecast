[pytest]
testpaths = tests
addopts = -ra
markers =
    network: hits real remote data servers; runs only with PS81_RUN_NETWORK_TESTS=1
filterwarnings =
    ignore:datetime.datetime.utcnow:DeprecationWarning:imdlib
    # Benign Cython size check that numpy itself silences at import; pytest resets filters.
    ignore:numpy.ndarray size changed:RuntimeWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
